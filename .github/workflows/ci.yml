name: Java Spring Boot CI and GHCR Login

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-registry-login:
    name: Test and Authenticate to GHCR
    runs-on: ubuntu-latest
    env:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run JUnit tests
        run: ./gradlew test

      - name: Explain missing registry secret
        if: ${{ env.REGISTRY_TOKEN == '' }}
        run: echo "REGISTRY_TOKEN is not set; add it in repository Actions secrets to enable GHCR login."

      - name: Log in to GitHub Container Registry
        if: ${{ env.REGISTRY_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

